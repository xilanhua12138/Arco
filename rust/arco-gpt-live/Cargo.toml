[package]
name = "arco-gpt-live"
version = "0.3.16"
description = "Beta GPT-Live WebRTC worker and transport probe for Arco"
authors = ["Arco contributors"]
license = "MIT"
repository = "https://github.com/xilanhua12138/Arco"
edition = "2024"
rust-version = "1.88"

[lib]
name = "arco_gpt_live"

[dependencies]
arco-core = { path = "../arco-core" }
async-http-proxy = { version = "1.2.5", features = ["basic-auth", "runtime-tokio"] }
async-trait = "0.1.89"
bytes = "1.12"
futures-util = "0.3"
opus-pure = "=0.2.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rtc = "=0.20.4"
serde_json = "1.0"
tokio = { version = "1.52", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
uuid = { version = "1.23", features = ["v4"] }
webrtc = "=0.20.4"

[dev-dependencies]
tempfile = "3.15"
