[package]
name = "arco-core"
version = "0.3.16"
description = "Framework-independent backend for the native Arco macOS app"
authors = ["Arco contributors"]
license = "MIT"
repository = "https://github.com/xilanhua12138/Arco"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arco_core"
crate-type = ["staticlib", "rlib"]

[features]
deepgram-worker = []
elevenlabs-worker = []
doubao-worker = []

[[bin]]
name = "arco-deepgram-transcriber"
path = "src/bin/arco-deepgram-transcriber.rs"
required-features = ["deepgram-worker"]

[[bin]]
name = "arco-elevenlabs-transcriber"
path = "src/bin/arco-elevenlabs-transcriber.rs"
required-features = ["elevenlabs-worker"]

[[bin]]
name = "arco-doubao-transcriber"
path = "src/bin/arco-doubao-transcriber.rs"
required-features = ["doubao-worker"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = "1.1"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
tokio = { version = "1.44", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.23", features = ["v4"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.2"

[dev-dependencies]
serial_test = "3.2"
