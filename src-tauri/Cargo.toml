[package]
name = "Arco"
version = "0.2.11"
description = "AI-native meeting copilot powered by the user's local agent CLI"
authors = ["Arco contributors"]
license = "MIT"
repository = "https://github.com/xilanhua12138/Arco"
edition = "2021"
rust-version = "1.77.2"
default-run = "Arco"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "arco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
deepgram-sidecar = []
elevenlabs-sidecar = []
doubao-sidecar = []

[[bin]]
name = "arco-deepgram-transcriber"
path = "src/bin/arco-deepgram-transcriber.rs"
required-features = ["deepgram-sidecar"]

[[bin]]
name = "arco-elevenlabs-transcriber"
path = "src/bin/arco-elevenlabs-transcriber.rs"
required-features = ["elevenlabs-sidecar"]

[[bin]]
name = "arco-doubao-transcriber"
path = "src/bin/arco-doubao-transcriber.rs"
required-features = ["doubao-sidecar"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
libc = "0.2"
futures-util = "0.3"
base64 = "0.22"
flate2 = "1.1"
tokio = { version = "1.44", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3.15"
wait-timeout = "0.2"
uuid = { version = "1.23", features = ["v4"] }
ureq = { version = "2.12", features = ["json"] }
urlencoding = "2.1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSBitmapImageRep", "NSColor", "NSImage", "NSImageRep", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
security-framework = "3.2"

[dev-dependencies]
serial_test = "3.2"
