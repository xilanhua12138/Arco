[package]
name = "arco"
version = "0.1.0"
description = "AI-native meeting copilot powered by the user's local agent CLI"
authors = ["Arco contributors"]
license = "MIT"
repository = "https://github.com/xilanhua12138/Arco"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "arco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = "0.4"
libc = "0.2"
tauri = { version = "2.11.3", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-dialog = "2"
tempfile = "3.15"
wait-timeout = "0.2"
uuid = { version = "1.23", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSBitmapImageRep", "NSColor", "NSImage", "NSImageRep", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }

[dev-dependencies]
serial_test = "3.2"
